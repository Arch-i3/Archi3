# Desktop Environments
- id: gnome
  name: GNOME
  category: desktop-environment
  description: "Modern, letisztult asztali kornyezet, amely az egyszerusegre es a hatekonysagra osszpontosit. Az Activities (Tevekenysegek) nezet segitsegevel kezelheted az ablakokat es indíthatod az alkalmazasokat."
  website: https://www.gnome.org/
  logo: /assets/images/gnome-logo.jpg
  screenshot: /assets/images/gnome-screenshot.jpg
  tilingType: stacking
  displayServer: wayland
  features:
    - Activities Overview
    - Dynamic Workspaces
    - Extensions Support
    - Touch Gestures
    - Night Light
    - Integrated Search
  resourceUsage: heavy
  customization: low
  beginnerFriendly: true
  memoryUsageMB: 800
  cpuUsagePercent: 3.5
  diskSpaceMB: 2800

- id: kde-plasma
  name: KDE Plasma
  category: desktop-environment
  description: "Rendkivul testreszabhato asztali kornyezet hagyomanyos elrendezessel. Kivalo Wayland-tamogatas HDR es szinkezelessel. A widgetek es a KDE Connect segitsegevel telefonodat is osszekötheted a gepeddel."
  website: https://kde.org/plasma-desktop/
  logo: /assets/images/kde-plasma-logo.jpg
  screenshot: /assets/images/kde-plasma-screenshot.jpg
  tilingType: stacking
  displayServer: both
  features:
    - Highly Customizable
    - KDE Connect
    - Activities
    - Widgets
    - HDR Support
    - Window Tiling
  resourceUsage: moderate
  customization: high
  beginnerFriendly: true
  memoryUsageMB: 620
  cpuUsagePercent: 2.8
  diskSpaceMB: 2200

